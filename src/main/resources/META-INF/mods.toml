modLoader="javafml"
loaderVersion="${loader_range}"
issueTrackerURL="https://github.com/mmyddd/GregTech-Construct/issues"
logoFile="logo.png"
license="MIT"

[[mods]]
modId="tconstruct"
version="${version}"
displayName="GregTech Construct"

authors="Slime Knights, mmyddd & OftenOviour"
description='''
A little of this, a little of that, a lot of tinkering, and a lot of tools
    '''
displayURL="https://www.curseforge.com/minecraft/mc-mods/gtconstruct"

[[dependencies.tconstruct]]
modId="forge"
mandatory=true
versionRange="${forge_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tconstruct]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tconstruct]]
modId="mantle"
mandatory=true
versionRange="${mantle_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tconstruct]]
modId="emi"
mandatory=false
versionRange="${emi_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.tconstruct]]
modId="jsonthings"
mandatory=false
versionRange="${json_things_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tconstruct]]
modId="apotheosis"
mandatory=false
versionRange="[7.4.8,7.5)"
ordering="NONE"
side="BOTH"

[[dependencies.tconstruct]]
modId="gtceu"
mandatory=true
    versionRange="[7.1.0,)"
ordering="BEFORE"
side="BOTH"

# Tinkers' Ponder (merged into this jar as a second mod, upstream: https://github.com/Chemiofitor4096/TinkersPonder, MIT)
[[mods]]
modId="tponder"
version="${tponder_version}"
displayName="Tinkers' Ponder"
authors="Chemiofitor"
description='''
Ponder scenes for Tinkers' Construct, merged into GregTech-Construct.
'''

[[dependencies.tponder]]
modId="forge"
mandatory=true
versionRange="${forge_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tponder]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tponder]]
modId="ponder"
mandatory=true
versionRange="[1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.tponder]]
modId="tconstruct"
mandatory=true
versionRange="[3.10.1.0,)"
ordering="NONE"
side="BOTH"
